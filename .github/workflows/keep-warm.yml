# Free Render instances sleep after 15 idle minutes and take up to a minute to wake.
# This pings the site every 10 minutes so the first visitor doesn't wait.
# Turn it on by adding a repository variable SITE_URL (Settings → Secrets and
# variables → Actions → Variables), e.g. https://your-app.vercel.app
# One always-on free service uses about 744 of Render's 750 free hours a month.
# GitHub pauses scheduled workflows after 60 days without commits; re-enable it in the Actions tab.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 70 "$SITE_URL/api/health"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
