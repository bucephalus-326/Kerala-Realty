# Render Blueprint for the API (free plan). Render → New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for when the Blueprint is created; see docs/DEPLOY.md.
services:
  - type: web
    name: tharavad-api
    runtime: node
    plan: free
    region: singapore
    # Built from the repo root: the API reads web/src/data/generated at runtime.
    buildCommand: cd api && npm ci --include=dev && npm run build
    startCommand: cd api && npm start
    healthCheckPath: /health
    # Redeploy only when the API or its data changes.
    buildFilter:
      paths:
        - api/**
        - web/src/data/generated/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_DEMO_USERS
        value: "false"
